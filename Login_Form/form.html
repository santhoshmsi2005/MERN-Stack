<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!--FireBase SDK-->
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div class="max-w-[100%]">
        <div class="h-screen flex justify-center items-center bg-gradient-to-tr from-purple-500">
            <form action="" id="LoginForm">
                <div class="flex flex-col justify-center gap-6 backdrop-blur-md bg-white/20 p-10  rounded-xl shadow-lg shadow-black/50">
                    <div class="text-center pb-6">
                        <h1 class="font-bold text-xl">Login Form</h1>
                    </div>
                    <div>
                        <label class="text-lg font-medium" for="">Email : </label>
                        <input id="email" class="rounded-lg p-2 ring-offset-1 ring-blue-500 focus:ring-2 focus:outline-none" type="text">
                        <p id="email_message" class="text-red-500"></p>
                    </div>
                    <div>
                        <label class="text-lg font-medium" for="">Password : </label>
                        <input id="password" class="rounded-lg p-2 ring-offset-1 ring-blue-500 focus:ring-2 focus:outline-none"  type="password">
                        <p id="password_message" class="text-red-500"></p>
                    </div>
                    <div>
                        <button type="submit" class="bg-sky-500 text-white px-5 py-2 rounded-lg hover:bg-sky-600 active:bg-sky-700 ">Submit</button>
                    </div>
                    <div class="flex justify-center">
                        <p id="success_text" class="text-green-500 font-semibold"></p>
                    </div>
                </div>
            </form>
        </div>

    </div>
</body>
<script src="./form2.js"></script>
</html>
