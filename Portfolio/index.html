<script>

    let menuIcon = document.getElementById("menuIcon")
    let crossIcon = document.getElementById("crossIcon")
    let navItem = document.getElementById("navItem")
    let lightON = document.getElementById("lightON")
    let lightOFF = document.getElementById("lightOFF")
    let totalBody = document.getElementById("totalBody")
    let navBarShadow = document.getElementById("navBarShadow")

    if(menuIcon && crossIcon && navItem) {
        menuIcon.addEventListener("click" , () => {
            crossIcon.classList.remove("hidden")
            menuIcon.classList.add("hidden")
            navItem.classList.remove("hidden")
        })

        crossIcon.addEventListener("click" , () => {
            navItem.classList.add("hidden")
            menuIcon.classList.remove("hidden")
            crossIcon.classList.add("hidden")
        })
    }

    // Scroll Animation Logic
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.15
    };

    const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('scroll-show');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    document.querySelectorAll('.scroll-hidden').forEach((element) => {
        observer.observe(element);
    });

    // Remove Loader on Window Load
    window.addEventListener('load', () => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
            setTimeout(() => {
                loader.classList.add('hidden-loader');
                setTimeout(startTypingEffect, 800);
            }, 800); // 800ms minimum display time for the loader
        } else {
            startTypingEffect();
        }
    });

    function startTypingEffect() {
        const typingText = document.getElementById("typing-text");
        if (!typingText) return;

        const parts = [
            { text: "Hi, I am ", class: "" },
            { text: "Sandy", class: "text-gradient font-bold drop-shadow-[0_0_15px_rgba(129,140,248,0.5)]" },
            { text: ", Web Developer, Designer, and Gamer.", class: "" }
        ];
        
        let partIndex = 0;
        let charIndex = 0;
        typingText.innerHTML = '';
        
        function type() {
            if (partIndex < parts.length) {
                let currentPart = parts[partIndex];
                
                let spanId = "type-part-" + partIndex;
                let spanElement = document.getElementById(spanId);
                
                if (!spanElement) {
                    spanElement = document.createElement('span');
                    spanElement.id = spanId;
                    if (currentPart.class) spanElement.className = currentPart.class;
                    typingText.appendChild(spanElement);
                }
                
                if (charIndex < currentPart.text.length) {
                    spanElement.innerHTML += currentPart.text.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, 50); // Speed of typing
                } else {
                    partIndex++;
                    charIndex = 0;
                    setTimeout(type, 50);
                }
            } else {
                // Done typing, add blinking cursor
                typingText.innerHTML += '<span class="animate-pulse">|</span>';
            }
        }
        
        type();
    }

</script>
